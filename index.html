
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Power System Installation Quotation - Oronjo Green Energy Solution</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .paper {
            width: 210mm;
            min-height: 297mm;
            background-color: #fcfbfa;
            position: relative;
            padding: 40px 45px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Exact Logo Background Watermark */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 450px;
            height: auto;
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            filter: grayscale(100%) contrast(150%);
            mix-blend-mode: multiply;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 55px;
            height: auto;
            object-fit: contain;
        }

        .company-name {
            font-size: 20px;
            font-weight: 800;
            color: #12753a;
            letter-spacing: 0.5px;
        }

        .company-subtitle {
            font-size: 9.5px;
            font-weight: 700;
            color: #12753a;
            margin-top: 2px;
            letter-spacing: 0.2px;
        }

        .meta-box {
            background-color: #f7eed8;
            border: 1px solid #e0c896;
            padding: 6px 12px;
            border-radius: 6px;
            text-align: right;
            font-size: 11px;
            line-height: 1.4;
            color: #333;
        }

        .meta-box strong {
            color: #111;
        }

        /* Title Banner */
        .title-banner {
            background-color: #1a6e38;
            color: #ffffff;
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 20px;
            border-left: 5px solid #0f4b25;
        }

        .title-banner h1 {
            font-size: 14px;
            text-align: center;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .title-details {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            padding: 0 10px;
        }

        /* Letter Body */
        .salutation {
            font-size: 12px;
            font-weight: bold;
            color: #222;
            margin-bottom: 6px;
        }

        .intro-text {
            font-size: 11px;
            color: #333;
            line-height: 1.45;
            margin-bottom: 18px;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            margin-bottom: 0;
        }

        th {
            background-color: #1e592f;
            color: #ffffff;
            font-weight: bold;
            padding: 8px 10px;
            text-align: left;
        }

        th.qty, th.unit-price, th.total {
            text-align: right;
        }

        td {
            padding: 6px 10px;
            color: #222;
            border-bottom: 1px solid #e2e8e4;
        }

        tbody tr:nth-child(even) {
            background-color: rgba(230, 240, 233, 0.35);
        }

        tbody tr:nth-child(odd) {
            background-color: rgba(255, 255, 255, 0.45);
        }

        td.num {
            width: 30px;
        }

        td.qty {
            text-align: right;
            width: 60px;
        }

        td.unit-price {
            text-align: right;
            width: 110px;
        }

        td.total {
            text-align: right;
            width: 110px;
            font-weight: bold;
        }

        .total-row {
            background-color: #1e592f !important;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
        }

        .total-row td {
            color: #ffffff;
            padding: 9px 10px;
            border: none;
        }

        .total-row td.total-val {
            text-align: right;
        }

        /* Terms Box */
        .terms-box {
            background-color: #fcf4e4;
            border: 1px solid #e0ceaa;
            border-radius: 4px;
            padding: 12px 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .terms-title {
            font-size: 11px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .terms-box ul {
            list-style-type: disc;
            padding-left: 18px;
            font-size: 10.5px;
            color: #333;
            line-height: 1.5;
        }

        .terms-box li {
            margin-bottom: 2px;
        }

        /* Outro Text & Signature */
        .outro-text {
            font-size: 11px;
            color: #333;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .closing {
            font-size: 11px;
            line-height: 1.4;
            color: #222;
        }

        .closing strong {
            display: block;
        }

        /* Footer Line */
        .footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1.5px solid #287a41;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            color: #287a41;
        }

        @media print {
            body {
                background-color: #fff;
                padding: 0;
            }
            .paper {
                box-shadow: none;
                width: 100%;
                min-height: 100vh;
            }
        }
    </style>
</head>
